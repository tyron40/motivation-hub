name: Android 4.4 Legacy APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-kitkat-legacy]
    paths: ['legacy-android/**', '.github/workflows/legacy-android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: legacy-android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: motivation-fuel-legacy-kitkat-debug-apk
          path: legacy-android/app/build/outputs/apk/debug/app-debug.apk
